name: Java CI with Doppler
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      # Tu script impecable con reintentos para la red
      - name: Install Doppler CLI
        run: |
          for i in {1..3}; do
            curl -sSfL https://cli.doppler.com/install.sh | sh && break || echo "Attempt $i failed, retrying..."
            sleep 5
          done

      # ¡NO OLVIDES ESTE PASO AL FINAL!
      - name: Build and Test
        run: doppler run -- ./mvnw clean install
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}+