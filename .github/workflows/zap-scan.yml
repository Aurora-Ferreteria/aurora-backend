name: OWASP ZAP Security Scan

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Escaneo de vulnerabilidades
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar OWASP ZAP Baseline Scan
        # Usamos la versión estable moderna que no rompe la subida interna
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'https://aurora-backend-bqn9.onrender.com'
          # Desactivamos por completo que la acción intente crear un Issue en tu GitHub automáticamente
          token: ${{ secrets.GITHUB_TOKEN }}
          # Forzamos a que genere los archivos localmente en el corredor de Ubuntu
          rules_file_name: 'zap_rules.tsv'
          cmd_options: '-a'
          # Evitamos que la acción falle el pipeline de forma automática si encuentra alertas en tu API
          fail_action: false

      - name: Subir Reporte de Vulnerabilidades (Sistema Moderno)
        # Usamos la acción oficial de GitHub v4 para subir archivos de forma segura
        uses: actions/artifacts@v4
        # Esto se ejecuta SIEMPRE, incluso si el paso anterior encontró vulnerabilidades
        if: always()
        with:
          name: zap-security-report
          path: |
            zap_report.html