name: OWASP ZAP Security Scan

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  zap_scan:
    runs-on: ubuntu-latest
    name: Escaneo de vulnerabilidades

    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Ejecutar OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://aurora-backend-bqn9.onrender.com'
          fail_action: false
          artifact_name: 'zap-scan-report'