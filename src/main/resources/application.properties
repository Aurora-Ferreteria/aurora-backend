spring.application.name=aurora
# ==============================
# CONFIGURACION DE LA BASE DE DATOS NEON
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# ===============================
# CONFIGURACION DE HIBERNATE / JPA
# ===============================
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# CONFIGURACIÓN DE REDIS
# ===============================
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

# Tiempo de vida de la caché (Opcional, pero recomendado)
spring.cache.redis.time-to-live=600000

# ===============================
# CONFIGURACION DE AUTH0 (SECURITY)
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://aurorajk.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audience=https://apiaurora
api.zuplo.secret=${ZUPLO_SECRET}

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG

# ===============================
# CONFIGURACIÓN DE POOL HIKARI (Para evitar congelamientos con Neon)
# ===============================
# Tiempo máximo que Spring esperará por una conexión antes de lanzar un error (30 segundos, en vez de infinito)
spring.datasource.hikari.connection-timeout=30000
# Tiempo máximo que una conexión puede estar ociosa en el pool (Neon la corta a los 10-15 min, la dejamos en 5 min)
spring.datasource.hikari.idle-timeout=300000
# Tiempo de vida máximo de una conexión en el pool (30 minutos)
spring.datasource.hikari.max-lifetime=1800000
# Número máximo de conexiones simultáneas
spring.datasource.hikari.maximum-pool-size=10

server.port=${PORT:8080}